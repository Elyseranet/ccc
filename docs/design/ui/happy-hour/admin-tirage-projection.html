<script>
/* Démo de la maquette uniquement (hors produit) : choix de variante, rejouer (élément recloné), résultat. Aucun timer, aucune animation pilotée en JS. */
(() => {
  const pj = document.getElementById('pj'), bar = document.querySelector('.pj-demo');
  let cur = pj;
  const setV = (v) => { cur = (() => { const c = cur.cloneNode(true); c.dataset.v = v; c.dataset.st = 'draw'; cur.replaceWith(c); return c; })(); bar.querySelectorAll('[data-v]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === v))); };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.v) setV(t.dataset.v);
    else if ('replay' in t.dataset) setV(cur.dataset.v);
    else if ('skip' in t.dataset) cur.dataset.st = 'done';
  });
  const q = new URLSearchParams(location.search);
  if (q.get('v')) setV(q.get('v'));
  if (q.get('etat') === 'done') cur.dataset.st = 'done';
  if (q.get('demo') === '0') bar.hidden = true;
})();
</script>
