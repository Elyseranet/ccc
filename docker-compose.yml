services:
  db:
    image: postgres:16-alpine
    container_name: ccc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NUXT_DATABASE_DATABASE:-ccc}
      POSTGRES_USER: ${NUXT_DATABASE_USERNAME:-ccc}
      POSTGRES_PASSWORD: ${NUXT_DATABASE_PASSWORD:?Set NUXT_DATABASE_PASSWORD in .env}
    ports:
      - "${NUXT_DATABASE_PORT:-5432}:5432"
    volumes:
      - ccc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccc-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_DATABASE_HOST: db
      NUXT_DATABASE_PORT: 5432
      NUXT_DATABASE_USERNAME: ${NUXT_DATABASE_USERNAME:-ccc}
      NUXT_DATABASE_PASSWORD: ${NUXT_DATABASE_PASSWORD:?Set NUXT_DATABASE_PASSWORD in .env}
      NUXT_DATABASE_DATABASE: ${NUXT_DATABASE_DATABASE:-ccc}
      NUXT_AUTH_DEVICE_COOKIE_SECRET: ${NUXT_AUTH_DEVICE_COOKIE_SECRET:?Set NUXT_AUTH_DEVICE_COOKIE_SECRET in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ccc_db_data:
